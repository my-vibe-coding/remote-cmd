name: Release

# 推送 v* 标签时触发：构建 Windows + Alpine(musl) 发布包并上传到 GitHub Release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl # 静态链接，可直接在 Alpine 上运行
    steps:
      - uses: actions/checkout@v4

      # 前端产物在编译期通过 read_dir!("web/dist") 嵌入，必须先于 cargo build
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # ring 的 C 代码在 musl 目标下需要 musl-gcc
      - name: Install musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/${{ matrix.target }}/release/remote-cmd.exe -DestinationPath remote-cmd-${{ github.ref_name }}-${{ matrix.target }}.zip

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar czf remote-cmd-${{ github.ref_name }}-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release remote-cmd

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            remote-cmd-*.zip
            remote-cmd-*.tar.gz
