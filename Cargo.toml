[package]
name = "remote-cmd"
version = "0.1.2"
edition = "2024"

[dependencies]
macro-log = "0.3.0"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["macros", "ws"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
argon2 = "0.5"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
base64 = "0.22"
encoding_rs = "0.8"
tempfile = "3"
open = "5"
dirs = "5"
futures = "0.3"
tokio-stream = "0.1"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["rustls-tls-webpki-roots", "handshake"] }
thiserror = "2"
anyhow = "1"
portable-pty = "0.9"
crossterm = "0.29"
tower-http = { version = "0.6", features = ["trace"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Globalization", "Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
